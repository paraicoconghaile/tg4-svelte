customHeaders:
  - pattern: '/_app/immutable/**/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'

  - pattern: '/fonts/**/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=2592000'

  - pattern: '/icons/**/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=604800'

  - pattern: '/images/**/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=604800'